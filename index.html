<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaito System</title>

<style>

body{
    margin:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.title{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:18px;
}

.logo{
    width:40px;
    height:40px;
}

#examTitle{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    margin:20px 0;
}

#answerArea{
    max-width:520px;
    margin:30px auto;
}

.sectionTitle{
    font-size:28px;
    font-weight:bold;
    margin:30px 0 20px;
    text-align:left;
}

.answerRow{
    margin-bottom:25px;
}

.answerNumber{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:left;
}

.answerButtons{
    display:flex;
    gap:15px;
    justify-content:flex-start;
}

.answerButtons button{
    width:56px;
    height:56px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #999;
    border-radius:8px;
    background:#fff;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
    <img src="トータルロゴ.png" alt="Logo" class="logo">
    <span>Kaito System</span>
</h1>

<div id="examTitle">
Loading...
</div>

<hr>

<div id="answerArea">
</div>

</div>

<script>

document.getElementById("examTitle").textContent = "JLPT N5 2012 All";

const answerArea = document.getElementById("answerArea");

answerArea.innerHTML = `
<div class="sectionTitle">語彙</div>

<div class="answerRow">
    <div class="answerNumber">問題1</div>
    <div class="answerButtons">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
    </div>
</div>

<div class="answerRow">
    <div class="answerNumber">問題2</div>
    <div class="answerButtons">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
    </div>
</div>

<div class="answerRow">
    <div class="answerNumber">問題3</div>
    <div class="answerButtons">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
    </div>
</div>
`;

</script>

</body>
</html>
