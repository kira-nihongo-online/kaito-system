<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaito System</title>

<style>

#scoreButton{
    padding:14px 40px;
    font-size:24px;
    font-weight:bold;
    background:#4CAF50;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#scoreButton:hover{
    background:#43A047;
}

body{
    margin:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.title{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:18px;
}

.logo{
    width:40px;
    height:40px;
}

#examTitle{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    margin:20px 0;
}

#answerArea{
    max-width:520px;
    margin:30px auto;
}

.sectionTitle{
    font-size:28px;
    font-weight:bold;
    margin:30px 0 20px;
    text-align:left;
}

.answerRow{
    margin-bottom:25px;
}

.answerNumber{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:left;
}

.answerButtons{
    display:flex;
    gap:15px;
    justify-content:flex-start;
}

.answerButtons button{
    width:56px;
    height:56px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #999;
    border-radius:8px;
    background:#fff;
}

.answerButtons button.selected{
    background:#ff9800;
    color:#fff;
    border-color:#ff9800;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
    <img src="トータルロゴ.png" alt="Logo" class="logo">
    <span>Kaito System</span>
</h1>

<div id="examTitle">
Loading...
</div>

<hr>

<div id="answerArea">
</div>

<div style="text-align:center; margin:40px 0;">
    <button id="scoreButton">採点する</button>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbz47LCd1aYpTO0gteNXnlzYVZ4hBk04grk6ezj0Xe6xclm9PhGgMc27qKDHTP3mMVvg/exec";

const params = new URLSearchParams(window.location.search);
const materialId = params.get("material") || "N5-2012";

fetch(`${API_URL}?action=materials`)
.then(res => res.json())
.then(materials => {

    const material = materials.find(m => m.materialId === materialId);

    if (material) {
        document.getElementById("examTitle").textContent = material.name;
    }

});

const answerArea = document.getElementById("answerArea");

// 回答保存用
let answers = {};

// 保存キー（教材ごと）
const storageKey = "answers_" + materialId;

// 保存データ読み込み
const saved = localStorage.getItem(storageKey);

if (saved) {
    answers = JSON.parse(saved);
}

fetch(`${API_URL}?action=answers&materialId=${materialId}`)
    .then(res => res.json())
    
.then(data => {

    let html = "";

    // セクションごとにまとめる
    const sections = {};

    data.forEach(item => {

        const section = item.type;

        if (!sections[section]) {
            sections[section] = [];
        }

        sections[section].push(item);

    });

    // HTML生成
    Object.keys(sections).forEach(section => {

        let sectionTitle = section;

        if (section === "goi") sectionTitle = "語彙（goi）";
        if (section === "bunpou") sectionTitle = "文法（bunpou）";
        if (section === "dokkai") sectionTitle = "読解（dokkai）";

        if (section.startsWith("choukai")) {
            const no = section.replace("choukai", "");
            sectionTitle = `聴解${no}（${section}）`;
        }

        html += `<div class="sectionTitle">${sectionTitle}</div>`;

        sections[section].forEach((item, index) => {

        const answerKey = section + "-" + (index + 1);

            html += `
            <div class="answerRow" data-key="${answerKey}">

                <div class="answerNumber">
                    問題${index + 1}
                </div>

                <div class="answerButtons">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                </div>

            </div>
            `;

        });

    });

    answerArea.innerHTML = html;

    // 保存された回答を復元
    document.querySelectorAll(".answerButtons").forEach((group, index) => {

        const answerKey = group.closest(".answerRow").dataset.key;
        const savedAnswer = answers[answerKey];

        if (!savedAnswer) return;

        const buttons = group.querySelectorAll("button");

        buttons.forEach(button => {

            if (button.textContent === savedAnswer) {
                button.classList.add("selected");
            }

        });

    });

    // ボタン処理
        document.querySelectorAll(".answerButtons").forEach((group,index)=>{

            const buttons = group.querySelectorAll("button");

            buttons.forEach(button=>{

                button.onclick=()=>{

                    buttons.forEach(b=>b.classList.remove("selected"));

                    button.classList.add("selected");

                    // 回答保存
                    const answerKey = group.closest(".answerRow").dataset.key;

                    answers[answerKey] = button.textContent;

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(answers)
                    );
                    
                    console.log("保存しました", answers);

                };

            });

        });

        });

       document.getElementById("scoreButton").onclick = () => {

           alert("採点ボタンが押されました");

    };

</script>

</body>
</html>
