<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaito System</title>

<style>

body{
    margin:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.title{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:18px;
}

.logo{
    width:40px;
    height:40px;
}

#examTitle{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    margin:20px 0;
}

#answerArea{
    max-width:520px;
    margin:30px auto;
}

.sectionTitle{
    font-size:28px;
    font-weight:bold;
    margin:30px 0 20px;
    text-align:left;
}

.answerRow{
    margin-bottom:25px;
}

.answerNumber{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:left;
}

.answerButtons{
    display:flex;
    gap:15px;
    justify-content:flex-start;
}

.answerButtons button{
    width:56px;
    height:56px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #999;
    border-radius:8px;
    background:#fff;
}

.answerButtons button.selected{
    background:#ff9800;
    color:#fff;
    border-color:#ff9800;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
    <img src="トータルロゴ.png" alt="Logo" class="logo">
    <span>Kaito System</span>
</h1>

<div id="examTitle">
Loading...
</div>

<hr>

<div id="answerArea">
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbz47LCd1aYpTO0gteNXnlzYVZ4hBk04grk6ezj0Xe6xclm9PhGgMc27qKDHTP3mMVvg/exec";

document.getElementById("examTitle").textContent = "JLPT N5 2012 All";

const answerArea = document.getElementById("answerArea");

fetch(`${API_URL}?action=answers&materialId=N5-2012`)
    .then(res => res.json())
    .then(data => {

        answerArea.innerHTML = `
        <h2>取得件数：${data.length}</h2>
        <pre>${JSON.stringify(data[0], null, 2)}</pre>
        `;

    });

</script>

</body>
</html>
